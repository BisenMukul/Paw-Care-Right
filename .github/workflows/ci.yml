name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bombaypetcompany
          POSTGRES_PASSWORD: bombaypetcompany
          POSTGRES_DB: bombaypetcompany
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bombaypetcompany -d bombaypetcompany"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://bombaypetcompany:bombaypetcompany@localhost:5432/bombaypetcompany?schema=public
      REDIS_URL: redis://localhost:6379
      # T089: GIT_SHA feeds the pinned bombaypetcompany@{version}+{buildId} release
      # shape (CLAUDE §1a). SENTRY_AUTH_TOKEN is optional — its absence must
      # never fail CI (D7); the upload step below is gated on its presence.
      # APP_VERSION mirrors the runtime env var (default "0.0.0" until T099
      # wires real versioning) so the uploaded source-map release string can
      # never silently drift from the running app's actual release name
      # (finding F5) — once T099 sets a repo/environment `vars.APP_VERSION`,
      # this line needs no further edits. The `|| '0.0.0'` fallback is
      # load-bearing (review R3): an UNSET repo var renders as the empty
      # string — not undefined — which would defeat the Zod .default() and
      # fail every env-validated step in tokenless CI.
      GIT_SHA: ${{ github.sha }}
      APP_VERSION: ${{ vars.APP_VERSION || '0.0.0' }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm i --frozen-lockfile # triggers api postinstall `prisma generate` (no DB needed to generate)
      # MinIO must be a docker-run step (not a service container): GH Actions
      # services cannot pass the mandatory `server /data` command. Creds mirror
      # docker-compose; env.schema S3_* defaults already point at localhost:9000.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=bombaypetcompany -e MINIO_ROOT_PASSWORD=bombaypetcompany-dev-secret \
            minio/minio:RELEASE.2024-11-07T00-52-20Z server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 2; done
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # T098: coverage gate (api services >= 80% statements, packages/ai >=
      # 80/80/80/70). Lives in THIS job, not a new one, because (a) the api
      # coverage run needs postgres+redis+MinIO, all already provisioned
      # above — a second job would duplicate the whole services block (drift
      # hazard) and double the infra; (b) it re-runs the api + ai suites
      # instrumented, a real runtime cost accepted in exchange for that; and
      # (c) it carries no `if:` — same as every other step here — so it is a
      # required gate, never silently skippable.
      - run: pnpm test:cov
      - run: pnpm build
      # T089 (plan D7): source-map upload is best-effort observability, never
      # a required gate — it only runs when a real SENTRY_AUTH_TOKEN secret is
      # configured. Org/project default to the §1a `bombaypetcompany` slugs.
      - name: Upload API source maps to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@v1
        env:
          SENTRY_ORG: ${{ secrets.SENTRY_ORG || 'bombaypetcompany' }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT || 'bombaypetcompany-api' }}
        with:
          environment: production
          version: "bombaypetcompany@${{ env.APP_VERSION || '0.0.0' }}+${{ github.sha }}"
          sourcemaps: apps/api/dist
      - name: Sentry source-map upload skipped
        if: env.SENTRY_AUTH_TOKEN == ''
        run: echo "Sentry source-map upload skipped — no SENTRY_AUTH_TOKEN secret" >> "$GITHUB_STEP_SUMMARY"
  # T113 — per-PR native fingerprint diff (OTA_UPDATES §1: "CI computes and
  # prints the fingerprint diff on every PR so this is never a surprise").
  # Informational by construction: it fails only if the tooling itself fails
  # (missing --base file, tool crash), NEVER because the fingerprint changed
  # — a changed fingerprint is a legitimate, expected event whose only
  # consequence is that prior binaries can no longer receive an OTA update.
  # PR-only (there is no meaningful base-tree diff on a plain push to main).
  # Costs an extra `pnpm i --frozen-lockfile` in `base-tree`: reusing the
  # head tree's `node_modules` for the base fingerprint would mask exactly
  # the native-dep change this job exists to detect (autolinking depends on
  # what's actually installed), so the base tree gets its own real install.
  mobile-fingerprint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm i --frozen-lockfile
      - name: Checkout base tree
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-tree
      - name: Install base tree
        working-directory: base-tree
        run: pnpm i --frozen-lockfile
      - name: Generate base fingerprints
        working-directory: base-tree/apps/mobile
        run: |
          npx --yes @expo/fingerprint@0.20.5 fingerprint:generate --platform android > "$GITHUB_WORKSPACE/base-android.json"
          npx --yes @expo/fingerprint@0.20.5 fingerprint:generate --platform ios > "$GITHUB_WORKSPACE/base-ios.json"
      # `set -o pipefail`: the default `bash -e {0}` run shell does NOT set
      # pipefail, so `cmd | tee -a "$GITHUB_STEP_SUMMARY"` would report the
      # pipeline's exit status as tee's (always 0), silently masking a real
      # script failure behind a green step -- exactly the `|| true`-style
      # masking `ota-config.test.ts` forbids in the script itself. pipefail
      # makes the step's own exit status the fingerprint-diff.sh status,
      # while a *changed* fingerprint still legitimately exits 0 (D8).
      # No `--` before the script's own flags: `pnpm run <script> -- --flag`
      # forwards a literal `--` on this pnpm major version, which the script
      # (correctly) used to reject as an unknown argument -- flags are passed
      # directly, and the script is additionally hardened to tolerate a `--`
      # if it does appear (defense in depth for other pnpm versions).
      - name: Fingerprint diff (android)
        working-directory: apps/mobile
        run: |
          set -o pipefail
          {
            echo '### Fingerprint diff — android'
            echo '```json'
            pnpm ota:fingerprint --base "$GITHUB_WORKSPACE/base-android.json" --platform android --out-dir "$GITHUB_WORKSPACE"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fingerprint diff (ios)
        working-directory: apps/mobile
        run: |
          set -o pipefail
          {
            echo '### Fingerprint diff — ios'
            echo '```json'
            pnpm ota:fingerprint --base "$GITHUB_WORKSPACE/base-ios.json" --platform ios --out-dir "$GITHUB_WORKSPACE"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload fingerprint artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-fingerprints-${{ github.run_id }}
          path: |
            base-android.json
            base-ios.json
            current-android.json
            current-ios.json
          retention-days: 30
          if-no-files-found: warn
  # AI eval gate — activated at T040. Fake provider: deterministic, keyless,
  # threshold-enforcing (packages/ai harness). Report uploaded as an artifact.
  ai-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Stamp date
        id: stamp
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - run: pnpm i --frozen-lockfile
      - run: pnpm test:ai-evals
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-evals-fake-${{ steps.stamp.outputs.date }}-${{ github.run_id }}
          path: loop/eval-reports/*.md
          retention-days: 30
          if-no-files-found: warn
  # T095: web performance/SEO budgets. This job is a REQUIRED gate (the card's
  # AC is "CI budget job green"), so unlike T089's Sentry upload it is never
  # skipped. It needs no secret and no external service: Chrome is preinstalled
  # on ubuntu-latest, lhci collects against a locally served build, and the
  # report is kept as a workflow artifact instead of lhci's cloud upload.
  web-perf-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm i --frozen-lockfile
      - run: pnpm --filter @bombaypetcompany/web build
      - name: Collect Lighthouse runs
        run: pnpm --filter @bombaypetcompany/web exec lhci collect --config=./lighthouserc.json
      - name: Assert performance + SEO budgets
        run: pnpm --filter @bombaypetcompany/web exec lhci assert --config=./lighthouserc.json
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ github.run_id }}
          # `pnpm --filter @bombaypetcompany/web exec` runs lhci with its cwd set
          # to apps/web (verified empirically), so lhci's `.lighthouseci/`
          # report directory lands there, not at the repo root.
          path: apps/web/.lighthouseci/
          retention-days: 30
          if-no-files-found: warn
  # T098: Playwright web E2E smoke (landing + one toxic food page). REQUIRED
  # gate, following the T095 web-perf-budget pattern exactly: unconditional
  # (no `if:` at job or step level), no secret needed.
  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm i --frozen-lockfile
      - run: pnpm --filter @bombaypetcompany/web build
      - run: npx playwright install --with-deps chromium
      - run: pnpm --filter @bombaypetcompany/web test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: apps/web/playwright-report/
          retention-days: 30
          if-no-files-found: warn
  # T096: security gates. REQUIRED (the card's AC is a "`pnpm audit`-gated CI
  # step"), so — unlike T089's Sentry upload — neither step is ever skipped and
  # neither is gated on a secret. `--audit-level high` fails the job on high +
  # critical only; suppressions live in root package.json's
  # `pnpm.auditConfig.ignoreGhsas`, each justified + expiry-dated in
  # docs/security/audit-allowlist.json (kept in sync by a test).
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # --ignore-scripts: this job never builds or runs the app, so prisma
      # generate & friends are pure cost. The install exists only so `pnpm
      # audit` resolves the workspace tree exactly as a developer would see it.
      - run: pnpm i --frozen-lockfile --ignore-scripts
      - name: Dependency audit (fails on high + critical)
        run: pnpm audit --audit-level high
      - name: Secrets scan (tracked files)
        run: node scripts/scan-secrets.js --tracked
